
project_root: "/work/bk1318/k202208/crai/hindcast-pp/Ml-Drought-Postprocessing"
external_data_root: "/work/bk1318/k202208/crai/hindcast-pp/data"

experiment: "cwb"
leadtime_tag: "lm1-6"

residuals_json: "${output_dir}/data/paths/qm_residuals_paths.json"

preprocessing_target: "cwb"
preprocessing_options:
  cwb:
    hindcasts_json: "${project_root}/droughtpp/eval_results/${experiment}/qm_rf/paths/preprocessing/hindcast_cwb_month_window_paths_06-11.json"
    reference_data: "${project_root}/droughtpp/eval_results/${experiment}/qm_rf/data/preprocessing/reference_cwb/reference_cwb_000.nc"
    reference: "${reference_data}"
    var_name: "CWB"
    predictor_vars: ["CWB"]
  cwb_intensity:
    hindcasts_json: "${project_root}/droughtpp/eval_results/${experiment}/qm_rf/paths/preprocessing/hindcast_cwb_month_window_intensity_paths_06-11.json"
    reference_data: "${project_root}/droughtpp/eval_results/${experiment}/qm_rf/data/preprocessing/reference_intensity/reference_cwb_000_intensity.nc"
    reference: "${reference_data}"
    var_name: "CWB_INTENSITY"
    predictor_vars: ["CWB_INTENSITY"]

output_dir: "${project_root}/droughtpp/eval_results/${experiment}/qm_rf"
model_dir: "${output_dir}/model"
model_name: "rf-basic"
corrected_residuals_json: "${output_dir}/data/paths/corrected_residuals_paths.json"
corrected_cwb_json: "${output_dir}/data/paths/corrected_cwb_paths.json"

include_obs_prev_lags: true

feature_flags:
  use_predictor: true
  use_lat: false 
  use_lon: false 
  use_lead_month: false 
additional_reference_features:
  - name: tas
    path: /work/bk1318/k202208/crai/hindcast-pp/data/spei/era5/tas/era5-monthly/tas_Amon_reanalysis_era5_r1i1p1_19400101-20241231_tamsatregion_dwdgrid_invlat.nc
    var_name: tas
  - name: precip
    path: /work/bk1318/k202208/crai/hindcast-pp/data/spei/era5/precip/tamsat/tamsat_precip_monthly_1983-2024_dwdgrid_invlat.nc
    var_name: rainfall_estimate_filled
  - name: cwb_clim
    path: /work/bk1318/k202208/crai/hindcast-pp/data/spei/cwb/era5/era5-tamsat_cwb_remapped_invlat_climatology.nc
    var_name: CWB
    mode: monthly_climatology
leave_out_years: [1995, 1996, 1997, 1998, 1999]

spei_month_range: [1, 3]
spei_std_multiplier: 1.0

workflow:
  run_qm: true 
  run_qm_eval: true 
  run_rf_train: true 
  run_rf_evaluate: true 
  evaluate_cwb: false 
  evaluate_spei: false 

data_dir: "${external_data_root}/spei/"
input_dir: "${project_root}/droughtpp/data/"
spei_json: null

leadmonth: [1, 2, 3, 4, 5, 6]

ml_arguments:
  train_leadmonth_specific: true 
  n_estimators: 700
  random_state: 0
  chunk_size: 30
  model_type: "mixed_rf" # one of "rf", "xgboost", "mixed_rf"
  mixed_base_model: "xgboost" # for mixed_rf: "rf" or "xgboost"
  mixed_group_by: "grid_id" # one of "grid_id", "year", "grid_year", "calendar_month", "knn_spatial", "knn_feature"
  knn_k: 15
  knn_metric: "euclidean"
  knn_eps: 1.0e-08
  xgb_learning_rate: 0.1
  xgb_max_depth: 8
  xgb_subsample: 0.8
  xgb_colsample_bytree: 0.8
  xgb_min_child_weight: 1
  val_fraction: 0.2
  xgb_eval_metric: "rmse"

qm_arguments:
  n_quantiles: 20
  bins: 50

plot_dir: "${output_dir}/plots/"
land_mask_path: /work/bk1318/k202208/crai/hindcast-pp/data/spei/landmask.nc
rf_results_tag: "rf_results_${ml_arguments.model_type}_base${ml_arguments.mixed_base_model}_groupby${ml_arguments.mixed_group_by}_nest${ml_arguments.n_estimators}_cs${ml_arguments.chunk_size}_xgblr${ml_arguments.xgb_learning_rate}_xgbmd${ml_arguments.xgb_max_depth}_xgbss${ml_arguments.xgb_subsample}_xgbmcw${ml_arguments.xgb_min_child_weight}_lm${ml_arguments.train_leadmonth_specific}"
qm_json_path: "${output_dir}/data/paths/qm_hindcast_paths.json"
show: false